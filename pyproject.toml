[project]
name = "dr-agent"
version = "0.1.0"
description = "LLM/VLM agent that discovers, proposes, and empirically validates domain-randomization parameters for MuJoCo tasks"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mujoco>=3.2",
    "openai>=1.50",
    "pydantic>=2.8",
    "numpy>=1.26",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
